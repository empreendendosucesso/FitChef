# Workflow de exemplo para construir e publicar o site no GitHub Pages
# Ajuste BUILD_COMMAND e PUBLISH_DIR conforme seu projeto (ex.: npm run build / dist / build / public)
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Altere estes valores conforme seu projeto:
  BUILD_COMMAND: "npm run build"   # comando que gera os arquivos estáticos
  PUBLISH_DIR: "build"             # pasta gerada pelo build (ex: build, dist, public)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            npm install
          else
            npm install
          fi

      - name: Build site
        run: ${{ env.BUILD_COMMAND }}

      - name: Verify publish directory and list contents
        run: |
          if [ ! -d "${{ env.PUBLISH_DIR }}" ]; then
            echo "ERROR: publish directory '${{ env.PUBLISH_DIR }}' não encontrada."
            echo "Diretórios presentes:"
            ls -la
            exit 1
          fi
          echo "Conteúdo de '${{ env.PUBLISH_DIR }}':"
          ls -la "${{ env.PUBLISH_DIR }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # Se precisar habilitar automaticamente Pages quando não existir, verifique a doc
        # desta action; alguns cenários suportam um parâmetro `enablement` (consulte a docs).

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v3
