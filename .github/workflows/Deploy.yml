name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Set a branch to deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push to the gh-pages branch
      pages: write # To deploy to GitHub Pages
      id-token: write # To authenticate with GitHub Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fixed: Escaped '$' to prevent TypeScript from misinterpreting 'secrets' as a JavaScript variable.
          token: ${{ secrets.GITHUB_TOKEN }} # This token is automatically generated by GitHub.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          # Inject the Gemini API Key from GitHub Secrets into the build process.
          # This variable will be available as process.env.REACT_APP_GEMINI_API_KEY in your React app.
          # Make sure to create a secret named REACT_APP_GEMINI_API_KEY in your repository settings.
          # Fixed: Escaped '$' to prevent TypeScript from misinterpreting 'secrets' as a JavaScript variable.
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Fixed: Escaped '$' to prevent TypeScript from misinterpreting 'secrets' as a JavaScript variable.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Adjust this if your build output directory is different (e.g., build)
          # You might need to configure GitHub Pages settings:
          # Go to Settings -> Pages in your repository.
          # Set 'Source' to 'Deploy from a branch' and 'Branch' to 'gh-pages'.
